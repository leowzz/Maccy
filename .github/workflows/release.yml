name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  macos:
    needs: checks
    # Keep the packaging host aligned with the CI build host.
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify tag matches committed version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cp .env.example .env
          python3 scripts/release.py check --version "$RELEASE_TAG"
      - name: Import self-signed application certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash scripts/prepare-macos-signing.sh
      - name: Build certificate-signed app and DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: make package
      - name: Remove signing keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/maccy-signing.keychain-db"
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain"
          fi
          rm -f "$RUNNER_TEMP/maccy-signing.p12" "$RUNNER_TEMP/maccy-signing.pem"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error

  server:
    needs: [checks, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify version and registry credentials
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          ALIYUN_REGISTRY_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        run: |
          cp .env.example .env
          python3 scripts/release.py check --version "$RELEASE_TAG"
          test -n "$ALIYUN_REGISTRY_USERNAME" || { echo 'Missing ALIYUN_REGISTRY_USERNAME'; exit 1; }
          test -n "$ALIYUN_REGISTRY_PASSWORD" || { echo 'Missing ALIYUN_REGISTRY_PASSWORD'; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: registry.cn-heyuan.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
      - name: Build and publish backend
        uses: docker/build-push-action@v6
        with:
          context: ./server
          platforms: linux/amd64
          push: true
          tags: registry.cn-heyuan.aliyuncs.com/leo03w/maccy-server:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=maccy-server
          cache-to: type=gha,mode=max,scope=maccy-server

  publish:
    needs: [macos, server]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: macos-release
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check ./*.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'NOTES'
          Universal macOS app for Apple Silicon and Intel, macOS 14 or newer.

          The app and DMG are signed with our self-signed application certificate, not Apple-notarized. Gatekeeper may block opening a downloaded copy on Macs that do not trust this certificate. Install updates manually from this repository's Releases; this pipeline does not publish a Sparkle appcast.
          NOTES
          printf '\nBackend image (linux/amd64): registry.cn-heyuan.aliyuncs.com/leo03w/maccy-server:%s\n' "$RELEASE_TAG" >> release-notes.md
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Maccy $RELEASE_TAG" --notes-file release-notes.md --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/*.dmg dist/*.sha256 --clobber
          gh release edit "$RELEASE_TAG" --draft=false
