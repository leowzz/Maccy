server:
  listen_address: ":8080"

database:
  dsn: "postgres://maccy:maccy@postgres:5432/maccy?sslmode=disable"
  max_connections: 20

account_id: "default"

auth:
  my-macbook: "replace-with-a-long-random-token"

zvec:
  enabled: false
  collection_path: ".zvec/clipboard"
  model_cache_path: ".zvec/models"
  # Leave empty to use ZVEC_JIEBA_DICT_DIR (set by the container image).
  jieba_dict_path: ""
  fts_tokenizer: "jieba"
  rrf_rank_constant: 60
  sync_batch_size: 20
